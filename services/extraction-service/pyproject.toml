[project]
name = "extraction-service"
version = "1.0.0"
description = "Microservicio stateless: extrae el texto de un PDF y lo devuelve en Markdown"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "cryptography>=50.0.2",
    "pypdf>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
