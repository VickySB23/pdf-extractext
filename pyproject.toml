[project]
name = "pdf-extractext"
version = "0.1.0"
description = "API para extraer y resumir texto de PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "pypdf>=3.0.0",
    "httpx>=0.25.0",
    "motor>=3.7.1",
    "pymongo>=4.9",
]

[dependency-groups]
dev = [
    "mongomock-motor>=0.0.36",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
