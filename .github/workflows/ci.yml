name: CI

on:
  push:
    branches: [main, parte-dos, microservicios]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [document-service, extraction-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependencias
        run: uv sync
      - name: Correr tests
        run: uv run pytest -q

  docker:
    name: Build de imágenes
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Construir el stack de carga
        run: docker compose build
      - name: Construir el stack completo
        run: docker compose -f docker-compose.full.yml build
