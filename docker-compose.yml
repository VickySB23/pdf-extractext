name: pdf-extractext

services:
  traefik:
    image: traefik:v3.6
    environment:
      TRAEFIK_PROVIDERS_CONSULCATALOG: "true"
      TRAEFIK_PROVIDERS_CONSULCATALOG_ENDPOINT_ADDRESS: consul:8500
      TRAEFIK_PROVIDERS_CONSULCATALOG_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_PROVIDERS_CONSULCATALOG_REFRESHINTERVAL: 5s
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
    ports:
      - "8080:80"
    depends_on:
      consul:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - traefik-net

  consul:
    image: hashicorp/consul:1.21
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind={{GetPrivateIP}}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "consul info | grep -q 'leader = true'"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - traefik-net

  extraction-service:
    image: pdf-extraction-service:v1.0.0
    build: ./services/extraction-service
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      CONSUL_URL: http://consul:8500
      QUEUE_TIMEOUT_SECONDS: "${QUEUE_TIMEOUT_SECONDS:-20}"
      RETRY_AFTER_SECONDS: "${RETRY_AFTER_SECONDS:-1}"
      OUTPUT_FORMAT: "${OUTPUT_FORMAT:-markdown}"
      RATE_LIMIT_AVERAGE: "${RATE_LIMIT_AVERAGE:-20}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-40}"
    depends_on:
      consul:
        condition: service_healthy
    networks:
      - traefik-net

  document-service:
    image: pdf-document-service:v1.0.0
    build: ./services/document-service
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      MONGO_URI: mongodb://db:27017
      MONGO_DB_NAME: pdf_db
      CONSUL_URL: http://consul:8500
      # Pasa por Traefik para balancear entre réplicas.
      EXTRACTION_URL: http://traefik
      RATE_LIMIT_AVERAGE: "${RATE_LIMIT_AVERAGE:-20}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-40}"
    depends_on:
      traefik:
        condition: service_started
      db:
        condition: service_healthy
      extraction-service:
        condition: service_healthy
    networks:
      - traefik-net
      - backend

  db:
    image: mongo:7.0
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

volumes:
  mongo_data:

networks:
  traefik-net:
    name: pdf-traefik-net
  backend:
